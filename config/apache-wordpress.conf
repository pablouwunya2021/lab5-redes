# /etc/apache2/sites-available/wordpress.conf en web01
# Reemplazar __DOMINIO__ (ej. lab5uvg.duckdns.org):
#   sudo sed -i 's/__DOMINIO__/lab5uvg.duckdns.org/g' /etc/apache2/sites-available/wordpress.conf
# El certificado debe existir antes de habilitar el sitio (certbot certonly).

<VirtualHost *:80>
    ServerName __DOMINIO__
    Redirect permanent / https://__DOMINIO__/
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMINIO__
    DocumentRoot /var/www/wordpress

    <Directory /var/www/wordpress>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/__DOMINIO__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMINIO__/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/wordpress_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress_access.log combined
</VirtualHost>
